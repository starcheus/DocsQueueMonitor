name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev --extra browser

      - name: Ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: Alembic upgrade (sqlite)
        run: |
          mkdir -p data
          uv run alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64)
        run: |
          if [ -f docker/Dockerfile ]; then
            docker buildx build --platform linux/amd64 -f docker/Dockerfile -t docsqueuemonitor:ci .
          else
            echo "Dockerfile not present yet; skipping"
          fi
