[project]
name = "docsqueuemonitor"
version = "0.2.4"
description = "Telegram bot that monitors DP Dokument foreign e-queue availability and notifies subscribers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "DocsQueueMonitor contributors" }]
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp>=3.10,<4",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<1",
    "lxml>=5.3,<6",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "structlog>=24.4,<26",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49,<2",
]
dev = [
    "mypy>=1.14,<2",
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
    "types-beautifulsoup4>=4.12,<5",
]

[project.scripts]
docsqueuemonitor = "app.main:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/app/database/migrations/versions/**" = ["E501", "I001"]
"src/app/bot/texts/**" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "alembic.*",
]
ignore_missing_imports = true
